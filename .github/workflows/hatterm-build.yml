#
# Build, package, and draft-release hatterm for Linux (amd64 + arm64), macOS (x64 + ARM64), and Windows (x64).
# Triggered on version tags (v*) and manually via workflow_dispatch.
# Artifacts are uploaded to the workflow run and attached to a draft GitHub Release.
# Windows builds are unsigned (no DigiCert signing); users may see a SmartScreen warning on first run.

name: Build hatterm
run-name: Build ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' — Manual' || '' }}

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096

jobs:
    build-app:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: darwin
                      runner: macos-latest
                    - platform: linux
                      runner: ubuntu-latest
                    - platform: windows
                      runner: windows-latest
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Configure Windows for native module builds
              if: matrix.platform == 'windows'
              shell: powershell
              run: |
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
                  Add-MpPreference -ExclusionPath "C:\npm\cache"
                  Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\npm-cache"

            - name: Install Linux build dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y \
                      libarchive-tools libopenjp2-tools rpm squashfs-tools ruby-dev
                  sudo gem install fpm

            - name: Install Zig (Linux + Windows)
              if: matrix.platform == 'linux' || matrix.platform == 'windows'
              uses: mlugg/setup-zig@v2

            - name: Install FPM (macOS)
              if: matrix.platform == 'darwin'
              run: sudo gem install fpm

            - name: Install FPM (Windows)
              if: matrix.platform == 'windows'
              run: gem install fpm
              shell: bash

            - uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: npm ci
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: echo
                  GIT_TERMINAL_PROMPT: "0"
                  GYP_MSVS_VERSION: "2022"

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Linux x64
              if: matrix.platform == 'linux'
              run: task package
              env:
                  USE_SYSTEM_FPM: true

            - name: Build Linux ARM64 (cross-compile from x64)
              if: matrix.platform == 'linux'
              run: |
                  VERSION=$(node version.cjs)
                  BUILDTIME=$(date +'%Y%m%d%H%M')
                  CGO_ENABLED=1 GOARCH=arm64 \
                    CC="zig cc -target aarch64-linux-gnu.2.28" \
                    go build -tags "osusergo,sqlite_omit_load_extension" \
                    -ldflags "-X main.BuildTime=${BUILDTIME} -X main.WaveVersion=${VERSION}" \
                    -o dist/bin/wavesrv.arm64 \
                    cmd/server/main-server.go
                  npm exec electron-builder -- -c electron-builder.config.cjs --linux --arm64 -p never
              env:
                  USE_SYSTEM_FPM: true

            - name: Build macOS
              if: matrix.platform == 'darwin'
              run: task package
              env:
                  USE_SYSTEM_FPM: true

            - name: Build Windows
              if: matrix.platform == 'windows'
              run: task package
              env:
                  USE_SYSTEM_FPM: true
              shell: powershell

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: hatterm-${{ matrix.runner }}
                  path: make

    create-release:
        runs-on: ubuntu-latest
        needs: build-app
        permissions:
            contents: write
        if: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') }}
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: make
                  merge-multiple: true

            - name: Create draft release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
                  name: hatterm ${{ github.ref_name }}
                  generate_release_notes: true
                  draft: true
                  files: |
                      make/*.zip
                      make/*.dmg
                      make/*.rpm
                      make/*.deb
                      make/*.pacman
                      make/*.AppImage
                      make/*.snap
                      make/*.exe
                      make/*.msi
